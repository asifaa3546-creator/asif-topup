<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIF TOPUP BD | Premium Gaming Top-Up</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#05070d;
  color:#fff;
  overflow-x:hidden;
}

header{
  padding:18px 15px;
  text-align:center;
  background:linear-gradient(135deg,#07111d,#101827);
  border-bottom:1px solid #1f3347;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#00ff88;
  text-shadow:0 0 18px rgba(0,255,136,.7);
}

.tagline{
  color:#9ba9ba;
  font-size:13px;
  margin-top:5px;
}

.hero{
  margin:15px;
  padding:28px 16px;
  text-align:center;
  border-radius:24px;
  background:radial-gradient(circle at top,#123329,#0a111c 55%,#060910);
  border:1px solid #1c4738;
  box-shadow:0 0 35px rgba(0,255,136,.12);
}

.hero img{
  width:125px;
  height:125px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #00ff88;
  box-shadow:0 0 30px rgba(0,255,136,.5);
}

.hero h1{
  margin-top:16px;
  font-size:27px;
  color:#00ff88;
}

.hero p{
  color:#c4ceda;
  margin-top:8px;
  line-height:1.6;
}

.warning{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,193,7,.08);
  border:1px solid rgba(255,193,7,.3);
  color:#ffd166;
  font-weight:bold;
  line-height:1.7;
}

.title{
  text-align:center;
  margin:25px 0 15px;
  color:#00ff88;
  font-size:22px;
}

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  padding:0 15px;
}

.game{
  padding:18px 8px;
  text-align:center;
  border-radius:15px;
  background:#0d1521;
  border:1px solid #1c2c3d;
  font-weight:bold;
}

.order-box{
  margin:15px;
  padding:20px;
  border-radius:20px;
  background:#0c131f;
  border:1px solid #1c2c3d;
}

label{
  display:block;
  margin:12px 0 7px;
  color:#b9c4d1;
  font-size:14px;
}

input,
select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #2a3b4e;
  outline:none;
  background:#070c14;
  color:#fff;
  font-size:15px;
}

input:focus,
select:focus{
  border-color:#00ff88;
}

.package{
  margin:15px;
  padding:18px;
  border-radius:17px;
  background:linear-gradient(145deg,#0e1724,#080d15);
  border:1px solid #203246;
}

.package h3{
  font-size:18px;
}

.price{
  color:#00ff88;
  font-size:25px;
  font-weight:900;
  margin:8px 0 13px;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:linear-gradient(90deg,#00c853,#00ff88);
  color:#00170b;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.btn:active{
  transform:scale(.97);
}

/* SUPPORT CENTER */

.support{
  margin:20px 15px;
  padding:22px 18px;
  border-radius:20px;
  background:linear-gradient(145deg,#101b2b,#080e18);
  border:1px solid #25415a;
  text-align:center;
  box-shadow:0 0 25px rgba(34,158,217,.12);
}

.support-icon{
  font-size:42px;
  margin-bottom:8px;
}

.support h2{
  color:#29a9e8;
  font-size:23px;
  margin-bottom:8px;
}

.support p{
  color:#aebaca;
  font-size:14px;
  line-height:1.7;
}

.support-user{
  display:inline-block;
  margin:14px 0;
  padding:10px 16px;
  border-radius:10px;
