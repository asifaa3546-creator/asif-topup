<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASIF TOPUP BD</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>💎 ASIF TOPUP BD</h1>

  <div class="packages">

    <!-- Diamond Package -->
    <div class="package-card">

      <h2>💎 Diamond Package</h2>

      <p>100 Diamonds</p>

      <h3>৳100</h3>

      <button onclick="buyPackage('Diamond Package', '100 Diamonds', '100')">
        BUY NOW
      </button>

      <!-- একই ছবি -->
      <img
        src="images/file_000000007fdc81fa8845db22fb00cf12.png"
        class="bottom-image"
      >

    </div>


    <!-- Weekly Package -->
    <div class="package-card">

      <h2>🔥 Weekly Package</h2>

      <p>Weekly Membership</p>

      <h3>৳150</h3>

      <button onclick="buyPackage('Weekly Package', 'Weekly Membership', '150')">
        BUY NOW
      </button>

      <!-- একই ছবি -->
      <img
        src="images/file_000000007fdc81fa8845db22fb00cf12.png"
        class="bottom-image"
      >

    </div>


    <!-- Monthly Package -->
    <div class="package-card">

      <h2>👑 Monthly Membership</h2>

      <p>Monthly Membership</p>

      <h3>৳775</h3>

      <button onclick="buyPackage('Monthly Membership', 'Monthly Membership', '775')">
        BUY NOW
      </button>

      <!-- একই ছবি -->
      <img
        src="images/file_000000007fdc81fa8845db22fb00cf12.png"
        class="bottom-image"
      >

    </div>

  </div>


  <script>

    function buyPackage(packageName, details, price) {

      alert(
        "Package: " + packageName +
        "\nDetails: " + details +
        "\nPrice: ৳" + price
      );

    }

  </script>

</body>
</html>
